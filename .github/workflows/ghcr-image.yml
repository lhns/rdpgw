# Fork only: test and publish the image to ghcr.io/<owner>/rdpgw. Upstream
# publishes to Docker Hub from docker-image.yml.
name: GHCR image

on:
  push:
    branches: [ "ldap-auth" ]
    tags: [ "v*" ]

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository_owner != 'bolkedebruin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: |
          sudo apt-get update && sudo apt-get install -y libpam-dev
          go mod tidy
          go vet ./...
          go test ./...
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dev/docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/rdpgw:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/rdpgw:sha-${{ github.sha }}
